[workspace]
members = ["server", "server/dev"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"

# Exact `=` pins: the lockfile's direct versions equal docs/PROTOTYPE-PLAN.md by construction, and `cargo update`
# cannot drift them. `default-features = false` lives here, not on a member entry (edition 2024 needs Rust 1.99+ to
# override it there).
[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["fs", "trace", "timeout", "set-header"] }
frankenstein = { version = "=0.52.1", default-features = false, features = ["client-reqwest"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
hex = "=0.4.3"
form_urlencoded = "=1.2.2"
getrandom = "=0.4.3"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
tempfile = "=3.27.0"
http-body-util = "=0.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
disallowed_methods = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
